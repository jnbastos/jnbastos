name: Build header

on:
  push:
    branches: [main]
    paths: [build.py, test_build.py]
  schedule:
    - cron: "0 6 1 * *" # monthly, so the uptime line stays current
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 test_build.py
      - run: python3 build.py
      - name: Commit the new header if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Refresh header"; git push; }
